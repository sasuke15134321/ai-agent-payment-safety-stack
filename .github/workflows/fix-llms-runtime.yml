name: One-time llms runtime fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-llms-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only the llms.txt runtime route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          marker = '@app.get("/llms.txt", include_in_schema=False)'
          start = text.index(marker)
          end = text.index('\n\n@app.get("/skill.md"', start)
          old = text[start:end]
          assert '# Agent Approval Unit Builder API' in old
          replacement = '''@app.get("/llms.txt", include_in_schema=False)
          async def llms_txt():
              from fastapi.responses import PlainTextResponse
              with open("llms.txt", "r", encoding="utf-8") as f:
                  return PlainTextResponse(f.read())'''
          updated = text[:start] + replacement + text[end:]
          assert updated.count(marker) == 1
          path.write_text(updated, encoding='utf-8')
          PY
          python -m py_compile main.py
          git diff --check

      - name: Commit the minimal fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --exit-code && exit 0
          git commit -m "Serve canonical llms.txt at runtime"
          git push
